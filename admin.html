<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1,viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#03080f"
    >

    <title>مدیریت کانتر مود</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        body{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:20px;
        }

        .admin-login{
            position:relative;

            width:min(460px,100%);

            padding:38px 28px;

            border-radius:30px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.11),
                    rgba(255,255,255,.035)
                );

            border:
                1px solid rgba(255,255,255,.14);

            box-shadow:
                0 35px 100px rgba(0,0,0,.5),
                inset 0 1px rgba(255,255,255,.13);

            backdrop-filter:
                blur(30px)
                saturate(150%);

            -webkit-backdrop-filter:
                blur(30px)
                saturate(150%);

            overflow:hidden;
        }

        .admin-login::before{
            content:"";

            position:absolute;

            width:300px;
            height:300px;

            top:-170px;
            left:-120px;

            border-radius:50%;

            background:
                radial-gradient(
                    circle,
                    rgba(55,175,240,.16),
                    transparent 68%
                );

            pointer-events:none;
        }

        .admin-logo{
            position:relative;

            width:105px;
            height:105px;

            display:block;

            margin:0 auto 20px;

            object-fit:cover;

            border-radius:50%;

            padding:5px;

            border:
                2px solid rgba(80,195,255,.7);

            box-shadow:
                0 0 40px rgba(35,155,235,.25);
        }

        .admin-title{
            text-align:center;

            font-size:26px;

            font-weight:800;

            margin-bottom:8px;
        }

        .admin-description{
            text-align:center;

            color:rgba(205,225,240,.62);

            font-size:13px;

            line-height:2;

            margin-bottom:25px;
        }

        .password-box{
            position:relative;

            margin-bottom:14px;
        }

        .password-box input{
            width:100%;

            height:56px;

            padding:
                0 17px;

            border-radius:16px;

            outline:none;

            color:white;

            background:
                rgba(0,0,0,.22);

            border:
                1px solid rgba(255,255,255,.12);

            box-shadow:
                inset 0 1px rgba(255,255,255,.05);

            transition:.25s;
        }

        .password-box input:focus{
            border-color:
                rgba(75,190,250,.5);

            box-shadow:
                0 0 0 4px rgba(45,165,230,.07);
        }

        .login-button{
            width:100%;

            height:56px;

            border-radius:16px;

            color:white;

            font-size:15px;

            font-weight:700;

            cursor:pointer;

            background:
                linear-gradient(
                    135deg,
                    rgba(39,154,225,.5),
                    rgba(20,87,135,.5)
                );

            border:
                1px solid rgba(105,205,255,.3);

            box-shadow:
                0 12px 30px rgba(0,0,0,.25),
                inset 0 1px rgba(255,255,255,.13);

            transition:.25s;
        }

        .login-button:hover{
            transform:translateY(-2px);

            box-shadow:
                0 16px 38px rgba(0,0,0,.35),
                0 0 25px rgba(40,160,235,.12);
        }

        .login-button:active{
            transform:scale(.98);
        }

        .login-error{
            min-height:22px;

            text-align:center;

            color:#ff8f9b;

            font-size:13px;

            margin-top:13px;
        }

        .back-site{
            display:block;

            text-align:center;

            margin-top:22px;

            color:rgba(195,220,238,.6);

            font-size:13px;
        }

        .back-site:hover{
            color:#fff;
        }

        @media(max-width:450px){

            .admin-login{
                padding:30px 18px;
                border-radius:25px;
            }

            .admin-logo{
                width:90px;
                height:90px;
            }

            .admin-title{
                font-size:23px;
            }

        }

    </style>

</head>


<body>

    <div id="particles"></div>


    <div class="admin-login">

        <img
            id="adminLogo"
            class="admin-logo"
            alt="کانتر مود"
        >


        <h1 class="admin-title">
            پنل مدیریت
        </h1>


        <p class="admin-description">
            مدیریت حرفه‌ای سایت کانتر مود
            <br>
            برای ورود رمز مدیریت را وارد کنید.
        </p>


        <div class="password-box">

            <input
                id="adminPassword"
                type="password"
                placeholder="رمز مدیریت"
                autocomplete="current-password"
            >

        </div>


        <button
            id="loginButton"
            class="login-button"
            type="button"
        >
            ورود به پنل مدیریت
        </button>


        <div
            id="loginError"
            class="login-error"
        ></div>


        <a
            class="back-site"
            href="index.html"
        >
            ← بازگشت به سایت
        </a>

    </div>


    <script src="data.js"></script>


    <script>

        /* =========================================
           ADMIN LOGIN
        ========================================= */

        const ADMIN_PASSWORD =
            "Abolfazl1389";


        const passwordInput =
            document.getElementById(
                "adminPassword"
            );


        const loginButton =
            document.getElementById(
                "loginButton"
            );


        const errorBox =
            document.getElementById(
                "loginError"
            );


        const adminLogo =
            document.getElementById(
                "adminLogo"
            );


        if(
            typeof DEFAULT_DATA !== "undefined" &&
            DEFAULT_DATA.site
        ){

            adminLogo.src =
                DEFAULT_DATA.site.mainImage;

        }


        function login(){

            const password =
                passwordInput.value;


            if(
                password ===
                ADMIN_PASSWORD
            ){

                sessionStorage.setItem(
                    "counter_mod_admin",
                    "true"
                );


                window.location.href =
                    "admin.html?panel=1";

            }else{

                errorBox.textContent =
                    "رمز مدیریت اشتباه است.";

                passwordInput.value = "";

                passwordInput.focus();

            }

        }


        loginButton.addEventListener(
            "click",
            login
        );


        passwordInput.addEventListener(
            "keydown",
            function(event){

                if(
                    event.key ===
                    "Enter"
                ){

                    login();

                }

            }
        );


        /* =========================================
           PARTICLES
        ========================================= */

        const particles =
            document.getElementById(
                "particles"
            );


        for(
            let i = 0;
            i < 22;
            i++
        ){

            const p =
                document.createElement(
                    "span"
                );

            p.className =
                "particle";

            const size =
                3 +
                Math.random() * 6;

            p.style.width =
                size + "px";

            p.style.height =
                size + "px";

            p.style.left =
                Math.random() * 100 + "%";

            p.style.animationDuration =
                (10 + Math.random() * 18)
                + "s";

            p.style.animationDelay =
                (-Math.random() * 20)
                + "s";

            particles.appendChild(p);

        }

    </script>

</body>

</html>
